[package]
name = "maky"
version = "0.2.0"
edition = "2024"
authors = ["Aytixel"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_with = "3"
serde-inline-default = "1"
serde-tuple-vec-map = "1"
toml = "1"
semver = { version = "1", features = ["serde"] }

clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
prettier-bytes = "0.2.1"

anyhow = "1"
async-recursion = "1"

git2 = "0.21"
auth-git2 = "0.6"
parse-git-url = "0.6"

blake3 = "1"
which = "8"
async-walkdir = "2"

tree-sitter = "0.26.10"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "io-util",
    "fs",
    "process",
    "sync",
] }
futures-lite = "2"
