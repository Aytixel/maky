[package]
name = "maky"
version = "0.2.0"
edition = "2021"
authors = ["Aytixel"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_with = "3"
serde-inline-default = "0.2"
toml = "0.8"
semver = { version = "1", features = ["serde"] }

clap = { version = "4", features = ["derive"] }
crossterm = "0.26"
kdam = { version = "0.6", features = ["rich", "spinner"] }

anyhow = "1"

pkg-config = "0.3"
vcpkg = "0.2"

git2 = "0.20"
parse-git-url = "0.5"

blake3 = "1"
which = "8"
async-walkdir = "2"

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "fs",
    "process",
] }
futures-lite = "2"
