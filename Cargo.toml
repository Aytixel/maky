[package]
name = "maky"
version = "0.2.0"
edition = "2021"
authors = ["Aytixel"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.213", features = ["derive"] }
serde_with = "3.11.0"
toml = "0.8.19"
semver = "1.0.23"

clap = { version = "4.5.20", features = ["derive"] }
crossterm = "0.28.1"
kdam = { version = "0.5.2", features = ["rich", "spinner"] }

indoc = "2.0.5"
anyhow = "1.0.91"

pkg-config = "0.3.31"
vcpkg = "0.2.15"

git2 = "0.19.0"
parse-git-url = "0.5.1"

comment = "0.1.1"
string_template = "0.2.1"
aho-corasick = "1.1.3"

blake3 = "1.5.4"
which = "6.0.3"
glob = "0.3.1"
async-walkdir = "2.0.0"

tokio = { version = "1.41.0", features = ["fs", "macros", "rt-multi-thread"] }
par-stream = "0.10.2"
async-recursion = "1.1.1"
